name: Deploy to Deno Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Frontend
        run: deno task build

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "greens" # TODO: Update project name in Deno Deploy dashboard if different
          entrypoint: "src/deploy.ts"
          root: "."
          include: "src/,data/,dist/,deno.json,deno.lock,guardian.config.json"
