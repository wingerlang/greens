<!-- Debug Flow Tab -->
<div x-show="tab === 'debug'" style="display:flex; flex-direction:column; gap:24px;">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;">🔍 Request Flow Tracer</h3>
            <div style="display: flex; gap: 10px;">
                <button @click="refreshDebugLog()" class="primary" style="padding: 8px 16px;">
                    🔄 Refresh
                </button>
                <button @click="clearDebugLog()" class="danger" style="padding: 8px 16px;">
                    🗑️ Clear
                </button>
            </div>
        </div>

        <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">
            Live trace of all requests through Guardian. Use this to debug why requests may not be completing.
        </div>

        <!-- Legend -->
        <div style="display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;">
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #3b82f6;"></span>
                RECEIVED</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #8b5cf6;"></span>
                MIDDLEWARE</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;"></span>
                PROXY_START</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #10b981;"></span>
                PROXY_SUCCESS</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></span>
                PROXY_FAIL</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span
                    style="width: 12px; height: 12px; border-radius: 50%; background: #06b6d4;"></span>
                RESPONSE</span>
        </div>

        <!-- Debug Entries -->
        <div
            style="max-height: 600px; overflow-y: auto; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.8rem;">
            <template x-if="debugLog.length === 0">
                <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                    No requests traced yet. Make a request to http://localhost:3000 to see the flow.
                </div>
            </template>

            <template x-for="entry in debugLog" :key="entry.id">
                <div style="display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem;"
                    :style="getTraceRowStyle(entry)">
                    <!-- Time -->
                    <span style="color: var(--text-muted); white-space: nowrap;"
                        x-text="new Date(entry.timestamp).toLocaleTimeString()"></span>

                    <span style="color: var(--text-muted); opacity: 0.3;">|</span>

                    <!-- Ago -->
                    <span
                        style="color: var(--text-muted); opacity: 0.9; white-space: nowrap; min-width: 75px; font-variant-numeric: tabular-nums;"
                        x-text="getTimeDiff(entry.timestamp)"></span>

                    <span style="color: var(--text-muted); opacity: 0.3;">|</span>

                    <!-- Phase Badge -->
                    <span style="padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap;" :style="{
                                      'RECEIVED': 'background: rgba(59, 130, 246, 0.2); color: #3b82f6;',
                                      'MIDDLEWARE': 'background: rgba(139, 92, 246, 0.2); color: #8b5cf6;',
                                      'PROXY_START': 'background: rgba(245, 158, 11, 0.2); color: #f59e0b;',
                                      'PROXY_SUCCESS': 'background: rgba(16, 185, 129, 0.2); color: #10b981;',
                                      'PROXY_FAIL': 'background: rgba(239, 68, 68, 0.2); color: #ef4444;',
                                      'RESPONSE': 'background: rgba(6, 182, 212, 0.2); color: #06b6d4;'
                                  }[entry.phase]" x-text="entry.phase"></span>

                    <!-- Method -->
                    <span style="font-weight: 600; white-space: nowrap; min-width: 40px;"
                        :style="{ 'GET': 'color: #10b981;', 'POST': 'color: #3b82f6;', 'PUT': 'color: #f59e0b;', 'DELETE': 'color: #ef4444;' }[entry.method] || 'color: white;'"
                        x-text="entry.method"></span>

                    <!-- Service -->
                    <span x-text="entry.service" style="color: #a855f7; white-space: nowrap;"></span>
                    <span x-show="entry.duration" style="color: var(--text-muted);"
                        x-text="'(' + entry.duration + 'ms)'"></span>

                    <!-- Path -->
                    <span
                        style="color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;"
                        x-text="entry.path"></span>

                    <!-- Status -->
                    <span x-show="entry.status" style="padding: 2px 6px; border-radius: 3px;" :style="entry.status >= 200 && entry.status < 300 ? 'background: rgba(16, 185, 129, 0.2); color: #10b981;' : 
                                          entry.status >= 400 ? 'background: rgba(239, 68, 68, 0.2); color: #ef4444;' : 
                                          'background: rgba(245, 158, 11, 0.2); color: #f59e0b;'"
                        x-text="entry.status"></span>

                    <span x-show="entry.error" style="color: #ef4444;" x-text="entry.error"></span>
                </div>
            </template>
        </div>
    </div>
</div>
