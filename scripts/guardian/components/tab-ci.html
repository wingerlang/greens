<!-- CI/CD Tab -->
<div x-show="tab === 'ci'">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0">Pipeline Status</h3>
            <button class="primary" @click="runCiPipeline()">Run Pipeline</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div style="text-align: center; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px;">
                <div style="font-size: 2rem; font-weight: 800;"
                    :style="{color: ciReport.status === 'passed' ? '#22c55e' : (ciReport.status === 'failed' ? '#ef4444' : '#94a3b8')}"
                    x-text="ciReport.status?.toUpperCase() || 'UNKNOWN'"></div>
                <div style="color: var(--text-muted); font-size: 0.85rem;">Status</div>
            </div>
            <div style="text-align: center; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px;">
                <div style="font-size: 2rem; font-weight: 800; color: #3b82f6;"
                    x-text="(ciReport.coverage?.percent || 0) + '%'"></div>
                <div style="color: var(--text-muted); font-size: 0.85rem;">Coverage</div>
            </div>
            <div style="text-align: center; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px;">
                <div style="font-size: 2rem; font-weight: 800; color: #a855f7;" x-text="ciReport.totalTests || 0">
                </div>
                <div style="color: var(--text-muted); font-size: 0.85rem;">Total Tests</div>
            </div>
        </div>

        <div class="code-block" style="max-height: 500px; overflow-y: auto;">
            <pre x-text="ciReport.output || 'No output'"></pre>
        </div>
    </div>
</div>
