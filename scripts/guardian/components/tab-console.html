<!-- Live Console Tab -->
<div x-show="tab === 'console'" style="display:flex; flex-direction:column; height:100%">
    <div class="card"
        style="flex:1; display:flex; flex-direction:column; padding:0; overflow:hidden; background:#000; border:1px solid #333">
        <div
            style="padding:10px 20px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; background:#111">
            <div style="font-family:monospace; color:#22c55e">>_ GUARDIAN LIVE STREAM</div>
            <div style="display:flex; gap:10px">
                <label style="font-size:0.8rem"><input type="checkbox" x-model="autoScroll">
                    Auto-Scroll</label>
                <button style="padding:2px 8px; font-size:0.8rem" @click="liveLogs = []">Clear</button>
            </div>
        </div>
        <div class="code-block"
            style="flex:1; border:none; border-radius:0; padding:20px; font-family:'Courier New', monospace; font-size:0.9rem"
            x-ref="consoleContainer">
            <template x-for="log in liveLogs" :key="log.id">
                <!-- Updated layout for console logs to fix formatting issues -->
                <div
                    style="margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:2px; display:flex; gap:10px; align-items:center;">
                    <span style="color:#666; white-space:nowrap"
                        x-text="new Date(log.timestamp).toLocaleTimeString()"></span>

                    <template x-if="log.type === 'request'">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span style="color:#3b82f6">[REQ]</span>
                            <span
                                :style="{color: log.status >= 500 ? '#ef4444' : (log.status >= 400 ? '#f59e0b' : '#22c55e')}"
                                x-text="log.status"></span>
                            <span style="color:#e2e8f0" x-text="log.method"></span>
                            <span style="color:#94a3b8" x-text="log.path"></span>
                            <span style="color:#666; font-size:0.8rem"
                                x-text="'(' + log.duration.toFixed(1) + 'ms)'"></span>
                            <span style="color:#666; font-size:0.8rem" x-text="log.ip"></span>
                        </div>
                    </template>

                    <template x-if="log.type === 'log'">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span style="color:#a855f7">[SYS]</span>
                            <span style="color:#e2e8f0" x-text="log.service?.toUpperCase()"></span>
                            <span x-text="log.message"></span>
                        </div>
                    </template>
                </div>
            </template>
            <div x-show="liveLogs.length === 0" style="color:#444; text-align:center; margin-top:50px">
                Waiting for events...</div>
        </div>
    </div>
</div>
